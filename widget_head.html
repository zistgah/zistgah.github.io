<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zistgah · Time</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050a18">
<!-- Zistgah home-screen widget — © 1993–2026 Abhishek Choudhary · AyeAI · model: Claude Opus 4.8
     Pure CHAKRA dial (project-ilm/chakra). Offline. Resizes to any widget cell. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#050a18;color:#f2ecdd;
    font:14px/1.4 -apple-system,Segoe UI,Roboto,system-ui,sans-serif;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.5rem;padding:.6rem;position:relative}
  canvas{max-width:min(78vw,78vh);max-height:min(78vw,78vh);aspect-ratio:1}
  #cal{position:absolute;top:.5rem;left:0;right:0;text-align:center;
    font:600 10px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:#c9b47e}
  #cal b{color:#f4ecd8;font-weight:600}
  #sub{position:absolute;bottom:.5rem;left:0;right:0;text-align:center;
    font:11px ui-monospace,Menlo,Consolas,monospace;color:#8d94a8}
  #now{background:none;border:1px solid rgba(201,164,78,.5);color:#c9a44e;
    font:10px ui-monospace,monospace;padding:.1rem .4rem;margin-left:.3rem;cursor:pointer;border-radius:4px}
  #brand{position:absolute;top:.5rem;right:.7rem;font:600 9px ui-monospace,monospace;
    letter-spacing:.22em;color:#c9a44e;opacity:.85}
  @media (prefers-color-scheme: light){
    html,body{background:#e7d9be;color:#2a2318}#cal{color:#6b5a3e}#cal b{color:#2a2318}
    #sub{color:#6b6257}}
</style></head><body>
<div id="wrap">
  <div id="cal">—</div>
  <span id="brand">ZISTGAH</span>
  <canvas id="dial" width="512" height="512" aria-label="CHAKRA time dial"></canvas>
  <div id="sub">—</div>
</div>
