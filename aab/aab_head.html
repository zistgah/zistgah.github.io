<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AAB · آب — paint a system, ship software</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06131f">
<!-- AAB studio — آب · Ascension for All and Beyond — © 1993–2026 Abhishek Choudhary · AyeAI
     model: Claude Opus 4.8. A paint program for systems: the human paints; the AI + the
     Verification-Gated process implement. Gamification is grounded — no oracle, no glow. -->
<style>
  :root{
    --bg:#06131f;--bg2:#0a1c2e;--ink:#eaf2f8;--mut:#7f97ab;--line:rgba(120,200,232,.18);
    --water:#3fb6d8;--water2:#2b7fa8;--gold:#c9a44e;--ok:#4fd08a;--warn:#e0a34a;--panel:rgba(10,28,46,.82);
    --mono:ui-monospace,Menlo,Consolas,monospace;--ui:-apple-system,Segoe UI,Roboto,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:
    radial-gradient(120% 80% at 50% -10%,#0d243a,#06131f 60%);color:var(--ink);
    font:15px/1.5 var(--ui);overflow:hidden;overscroll-behavior:none}
  #app{height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-bottom:1px solid var(--line);
    background:var(--panel);backdrop-filter:blur(8px);z-index:5}
  header .logo{font:600 15px var(--ui);letter-spacing:.02em}
  header .logo b{color:var(--water)}
  header .el{color:var(--mut);font:11px var(--mono);margin-left:-.2rem}
  header .xp{margin-left:auto;font:11px var(--mono);color:var(--gold)}
  header .lvl{font:11px var(--mono);color:var(--water);border:1px solid var(--line);
    padding:.15rem .5rem;border-radius:999px}
  /* palette rail */
  #stage{flex:1;display:flex;min-height:0}
  #palette{width:64px;flex:0 0 64px;border-right:1px solid var(--line);background:rgba(6,16,26,.6);
    display:flex;flex-direction:column;gap:.2rem;padding:.4rem .2rem;overflow-y:auto}
  .brush{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.5rem .2rem;
    border-radius:10px;cursor:pointer;border:1px solid transparent;color:var(--mut);font:8.5px var(--mono)}
  .brush svg{width:24px;height:24px}
  .brush.on{border-color:var(--water);background:rgba(63,182,216,.12);color:var(--ink)}
  .brush:active{transform:scale(.94)}
  /* canvas */
  #canvasWrap{flex:1;position:relative;min-width:0;touch-action:none;overflow:hidden}
  #canvas{position:absolute;inset:0}
  #hintbar{position:absolute;left:.6rem;top:.6rem;right:.6rem;font:11px var(--mono);color:var(--mut);
    pointer-events:none;text-shadow:0 1px 3px #000}
  /* inspector / quest drawer */
  #drawer{position:absolute;right:0;top:0;bottom:0;width:min(88vw,340px);background:var(--panel);
    backdrop-filter:blur(10px);border-left:1px solid var(--line);transform:translateX(100%);
    transition:transform .22s ease;z-index:6;display:flex;flex-direction:column;overflow-y:auto}
  #drawer.on{transform:translateX(0)}
  #drawer h3{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--water);
    padding:.9rem .9rem .3rem}
  #drawer .body{padding:0 .9rem 1rem}
  label.f{display:block;font:11px var(--mono);color:var(--mut);margin:.7rem 0 .2rem}
  input.f,textarea.f,select.f{width:100%;background:#08192a;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:.5rem .6rem;font:13px var(--ui)}
  textarea.f{min-height:64px;resize:vertical}
  .chipstate{display:inline-flex;align-items:center;gap:.3rem;font:10px var(--mono);
    padding:.2rem .5rem;border-radius:999px;border:1px solid var(--line)}
  .st-sketch{color:var(--mut)} .st-named{color:var(--water);border-color:rgba(63,182,216,.4)}
  .st-verified{color:var(--ok);border-color:rgba(79,208,138,.5)}
  .btn{display:block;width:100%;text-align:center;background:linear-gradient(180deg,var(--water),var(--water2));
    color:#04121c;font:600 13px var(--ui);border:none;border-radius:10px;padding:.7rem;margin-top:.8rem;
    cursor:pointer}
  .btn.ghost{background:none;color:var(--water);border:1px solid var(--line)}
  .btn.gold{background:linear-gradient(180deg,#e3c375,#c9a44e);color:#1a1305}
  /* bottom quest bar */
  #quests{flex:0 0 auto;display:flex;gap:.4rem;padding:.5rem .6rem;border-top:1px solid var(--line);
    background:var(--panel);overflow-x:auto}
  .quest{flex:0 0 auto;min-width:112px;border:1px solid var(--line);border-radius:10px;padding:.45rem .6rem;
    cursor:pointer;background:rgba(8,25,42,.6)}
  .quest .qn{font:9px var(--mono);color:var(--mut);letter-spacing:.06em}
  .quest .qt{font:600 12px var(--ui);margin-top:.1rem}
  .quest .qb{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:.4rem;overflow:hidden}
  .quest .qb i{display:block;height:100%;background:var(--water)}
  .quest.done{border-color:rgba(79,208,138,.5)}
  .quest.done .qb i{background:var(--ok)}
  .quest.active{border-color:var(--gold)}
  /* toast + modal */
  #toast{position:absolute;left:50%;bottom:5rem;transform:translateX(-50%);background:rgba(6,16,26,.95);
    border:1px solid var(--line);border-radius:10px;padding:.5rem .9rem;font:12px var(--mono);
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
  #toast.on{opacity:1}
  #modal{position:absolute;inset:0;background:rgba(3,10,16,.86);display:none;align-items:center;
    justify-content:center;z-index:10;padding:1rem}
  #modal.on{display:flex}
  #modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:560px;
    width:100%;max-height:86vh;overflow-y:auto;padding:1.1rem}
  #modal h2{font:600 15px var(--ui);color:var(--water);margin-bottom:.5rem}
  #modal pre{background:#04121c;border:1px solid var(--line);border-radius:8px;padding:.7rem;
    font:11px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:#bfe0ef;max-height:44vh;overflow:auto}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
  .row .btn{flex:1;margin-top:0;min-width:120px}
  .muted{color:var(--mut);font-size:12px}
  .k{color:var(--gold)}
</style></head><body>
<div id="app">
  <header>
    <span class="logo"><b>AAB</b> <span class="el">آب · water</span></span>
    <span class="lvl" id="lvl">Sketching</span>
    <span class="xp" id="xp">0 XP</span>
    <button class="lvl" id="btnOne" title="One-shot AI paint">✦ Paint</button>
    <button class="lvl" id="btnStep" title="Step-by-step">◇ Step</button>
    <button class="lvl" id="btnSet" title="AI provider">⚙</button>
  </header>
  <div id="stage">
    <div id="palette"></div>
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div id="hintbar">Tap a brush, then tap the canvas to place. Drag between nodes to wire a flow.</div>
    </div>
    <div id="drawer"><h3 id="drawerTitle">Inspect</h3><div class="body" id="drawerBody"></div></div>
  </div>
  <div id="quests"></div>
</div>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
